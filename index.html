<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- Pastikan viewport diatur untuk responsif -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mr. Data - Medical Record</title>
  
  <!-- Link ke file favicon.png lokal -->
  <link rel="icon" href="favicon.png?v=4" type="image/png">
  
  <!-- CSS untuk menangani masalah ikon gepeng dan tata letak -->
  <style>
    /* Reset margin dan padding default browser */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scrollbar pada halaman utama */
    }

    /* Kontainer untuk memaksa rasio aspek icon di tab browser (Trik ini untuk WebApp PWA) */
    /* Perlu diperhatikan: Tidak semua browser mendukung penuh css untuk favicon, 
       namun ini membantu dalam banyak kasus modern WebApp. */
    :root {
      color-scheme: light dark;
      /* Trik untuk beberapa browser: memberi tahu browser bahwa ikon ini harus diperlakukan 
         sebagai bagian dari web app dan mencoba mempertahankan aspek rasio asli */
      image-rendering: -webkit-optimize-contrast;
    }

    /* Styling iframe agar mengisi seluruh layar */
    .iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh; /* Menggunakan dvh (dynamic viewport height) untuk mobile yang lebih baik */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbz9p_0sg_QWBBDjrjriLSRVV7UjVU-_ZsvZ6P7r5T-7voDmuVa8RBhtIcS4DYY1dqtwMg/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>
</html>
